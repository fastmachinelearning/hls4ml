name: Check manifest

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  check-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # pre-commit.ci runs the default-stage hooks on every pull request, but not
      # check-manifest, which is manual-stage because it builds an sdist.
      - name: Pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files check-manifest
