variables:
  BAMBU_TEST_IMAGE: gitlab-registry.cern.ch/fastmachinelearning/hls4ml-testing:0.1.0.bambu
  BAMBU_URL: https://release.bambuhls.eu/bambu.ginevra3.AppImage

.pytest-bambu:
  stage: test
  image: $BAMBU_TEST_IMAGE
  tags:
    - corellia
  # Bambu jobs need a private image and a self-hosted runner that upstream does
  # not have; without this gate an upstream pipeline fails trying to pull them.
  # Auto-on for the namespace that owns the runner, or force with BAMBU_CI=1.
  rules:
    - if: '$BAMBU_CI == "1"'
    - if: '$CI_PROJECT_NAMESPACE == "edge-spaice"'
    - when: never
  variables:
    CONDA_ENV: "hls4ml-testing"
    EXTRA_DEPS: "[da,testing,testing-keras2,sr,optimization]"
    BAMBU_INSTALL_DIR: ".bambu-squashfs"
    USE_BAMBU_ARRAY_PARTITION: "1"
  before_script:
    - eval "$(conda shell.bash hook)"
    - conda activate "$CONDA_ENV"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git submodule update --init --recursive hls4ml/templates/bambu/
    - if [ "$EXAMPLEMODEL" = "1" ]; then git submodule update --init example-models; fi
    - pip install ".${EXTRA_DEPS}"
    - source /usr/local/bin/setup-bambu.sh
    - unset IFS
  script:
    - cd "$CI_PROJECT_DIR/test/pytest"
    - pytest $PYTESTFILE -rA --cov-report xml --cov-report term --cov=hls4ml --junitxml=report.xml --randomly-seed=42 --randomly-dont-reorganize --randomly-dont-reset-seed
  artifacts:
    when: always
    reports:
      junit:
        - test/pytest/report.xml
      coverage_report:
        coverage_format: cobertura
        path: test/pytest/coverage.xml
    paths:
      - test/pytest/*.tar.gz
      - test/pytest/synthesis_report_*.json

.pytest-bambu-keras3-only:
  extends: .pytest-bambu
  variables:
    CONDA_ENV: "hls4ml-testing-keras3"
    EXTRA_DEPS: "[da,testing,testing-keras3,sr]"
